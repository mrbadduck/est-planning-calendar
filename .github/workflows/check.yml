name: Checks
# The fast checks every change must pass — see scripts/check.sh (syntax, shared
# mirrors, help guard content, structural rules). The same script runs as the
# Claude Code Stop hook.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: scripts/check.sh
        run: ./scripts/check.sh
