name = "est-planning-proxy"
main = "src/worker.js"
compatibility_date = "2026-01-01"
account_id = "c68ba18b669e519e535be065dab431f1"   # pin the account so CI wrangler skips the /memberships auto-detect (not a secret — appears in dashboard URLs)

# Cross-isolate stale-while-revalidate cache (Workers KV, free tier). Coda calls
# are slow with multi-second tails, and per-isolate memory caches evaporate when
# isolates recycle — KV persists the People snapshot, /rows, and /ref reads so
# most requests never wait on Coda. (Cache API is a no-op on workers.dev, and we
# keep DNS at Hover, so KV is the only cross-isolate option — and it's global.)
[[kv_namespaces]]
binding = "CACHE"
id = "b962638db9cc47c7a89578ef7559a139"

[vars]
CODA_API_BASE  = "https://coda.io/apis/v1"
CODA_DOC_ID    = "DYAz_wCVfv"          # EST — Mission Control doc
CODA_TABLE_ID  = "grid--gYIvdD-cE"     # EST Planning Events SRC
CODA_SLOTS_TABLE  = "grid-hvmYYZAZYv"  # EST Slots SRC   (gather: sign-up slots per event)
CODA_CLAIMS_TABLE = "grid-xpPt3WxUR3"  # EST Claims SRC  (gather: a member's claim on a slot)
CODA_PEOPLE_TABLE = "grid-X316Eql8dE"  # EST People SRC  (gather find-or-create; also the auth read)
CODA_NOTES_COL_ID = "c-gCr2zZXbdZ"     # "Notes Doc" column — resolved by id so a rename can't break the read
CODA_NOTES_BUTTON_ID = "c-Xa89eEgVN5"   # notes-doc button ("Create Notes Doc") on EST Planning Events SRC — runs Copy file + writes the URL into the Notes Doc column
ALLOWED_ORIGIN = "https://plan.eastsidetribe.org,https://gather.eastsidetribe.org,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081"  # first entry = canonical; gather is the member app; 8080=plan / 8081=gather local dev
ALLOW_WRITES   = "true"                 # Plan 2b: writes enabled (still require a write-authorized identity)
FIREBASE_PROJECT_ID = "est-planning-calendar"   # Firebase project id; verified as the ID-token iss/aud
EVENTBRITE_ORG_ID = "1080997994263"     # EST Eventbrite organization id (public)
EVENTBRITE_TZ = "America/Chicago"       # wall-clock timezone for published event start/end
EVENTBRITE_COUNTRY = "US"                   # ISO country for EB venues
EVENTBRITE_AREA_CITY = "Nashville"          # coarse public city (registrants-only shows only this; public also tags it)
EVENTBRITE_AREA_REGION = "TN"               # coarse public region/state
CODA_PUBLISH_LOG_TABLE = "grid-CJNl0A1OGZ"  # Publish Log table — append-only audit of publish attempts
CODA_FEEDBACK_TABLE = "grid-pP5rwauO2j"     # Roadmap Feedback table — votable ideas board

# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put CODA_API_TOKEN     # a READ+WRITE, doc-scoped token (Plan 2b)
#   npx wrangler secret put EVENTBRITE_TOKEN   # Eventbrite private token (publish-out)
#   npx wrangler secret put APP_KEY            # optional, unused in the phased plan
