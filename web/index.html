<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EST Programming — Planning Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7; --ink:#1C1B22; --muted:#6B6A76; --faint:#9A9AA5;
    --hair:#E7E4DC; --hair-strong:#D8D4C9;
    --accent:#45459E; --accent-dk:#2E2E63; --accent-tint:#ECECF6;
    --today:#C0392B;
    --idea-bg:transparent;
    --cell-min:88px;
    --radius:7px;
    --shadow:0 1px 2px rgba(28,27,34,.06), 0 8px 24px rgba(28,27,34,.08);
    /* program hues */
    --p-kab:#6D5AE6; --p-din:#C0722E; --p-tot:#1F9488; --p-lit:#CE5590;
    --p-wan:#2F7DC4; --p-lch:#A23A5B; --p-sho:#4E9A3D; --p-oth:#5A5966;
    /* reference (muted) */
    --r-us:#9A9AA5; --r-jew:#B0904A; --r-part:#9C86A0; --r-shab:#8E9AB0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:13px; line-height:1.4; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}

  /* ---- top control bar (sticky) ---- */
  .bar{
    position:sticky;top:0;z-index:40;background:rgba(251,250,247,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--hair-strong);
    padding:12px 0 10px;margin-bottom:0;
  }
  .bar-inner{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar-inner.row2{margin-top:9px}
  .grow-sp{flex:1 1 20px}
  .brand{display:flex;flex-direction:column;gap:1px}
  .brand h1{
    font-family:Fraunces,serif;font-weight:600;font-size:19px;letter-spacing:.1px;margin:0;line-height:1.1;
  }
  .brand .sub{color:var(--muted);font-size:11.5px;letter-spacing:.2px}
  .info-btn{
    width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--hair-strong);
    background:#fff;color:var(--muted);font-family:Fraunces,serif;font-style:italic;font-weight:600;
    font-size:14px;line-height:1;cursor:pointer;transition:.12s;
  }
  .info-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
  .yearnav{display:flex;align-items:center;gap:6px}
  .yearnav .yr{font-family:Fraunces,serif;font-weight:600;font-size:15px;min-width:150px;text-align:center}
  .btn{
    font:inherit;font-size:12px;font-weight:500;color:var(--ink);
    background:#fff;border:1px solid var(--hair-strong);border-radius:6px;
    padding:6px 11px;cursor:pointer;transition:.12s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.icon{padding:6px 9px;font-size:13px;line-height:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--accent);background:var(--accent-tint)}
  .seg{display:inline-flex;border:1px solid var(--hair-strong);border-radius:6px;overflow:hidden;background:#fff}
  .seg button{font:inherit;font-size:11.5px;font-weight:500;border:0;background:transparent;padding:6px 10px;cursor:pointer;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .roleline{display:flex;align-items:center;gap:7px}
  .roleline .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px}

  /* ---- layers strip ---- */
  .layers{
    max-width:1180px;margin:0 auto;padding:9px 18px;display:flex;gap:8px 16px;
    align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--hair);
  }
  .layers .grp-label{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;margin-right:2px}
  .lyr{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:12px;color:var(--muted)}
  .lyr input{display:none}
  .lyr .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.08)}
  .lyr .swatch-ref{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .lyr[data-on="false"]{opacity:.4}
  .lyr[data-on="false"] .name{text-decoration:line-through}
  .spacer{flex:1 1 20px}

  /* ---- weekday header (sticky) ---- */
  .weekhead{
    position:sticky;top:var(--bar-h,96px);z-index:30;background:var(--paper);
    display:grid;grid-template-columns:repeat(8,minmax(0,1fr));
    border-bottom:1px solid var(--hair-strong);
  }
  .weekhead .corner{
    background:rgba(69,69,158,.06);border-right:2px solid rgba(69,69,158,.30);
    font-size:9px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    color:var(--faint);padding:7px 8px 6px;
  }
  .weekhead .wd{
    text-align:left;padding:7px 8px 6px;font-size:10.5px;font-weight:600;
    color:var(--faint);text-transform:uppercase;letter-spacing:.8px;
  }
  .weekhead .wd.we{color:#B98E86}

  /* ---- month block ---- */
  .month{border-bottom:1px solid var(--hair-strong)}
  .myear-head{
    position:sticky;top:calc(var(--bar-h,96px) + var(--wh-h,28px));z-index:20;background:var(--paper);
    font-family:Fraunces,serif;font-weight:600;font-size:15px;letter-spacing:.2px;
    padding:10px 0 8px 12px;border-bottom:1px solid var(--hair);
  }
  .myear-head .yy{color:var(--faint);font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:1px;margin-left:6px}
  .mgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
  .gcell{
    border-top:1px solid var(--hair);border-right:2px solid rgba(69,69,158,.30);
    padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;
    background:rgba(69,69,158,.06);position:relative;cursor:pointer;
  }
  .gcell:hover{background:rgba(69,69,158,.10)}
  .gcell .ghint{font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);opacity:.7}
  .gcell .gadd{position:absolute;right:5px;top:4px;font-size:12px;color:var(--accent);opacity:0}
  .gcell:hover .gadd{opacity:.5}
  .gchip{
    font-size:10px;line-height:1.25;border-radius:5px;padding:2px 6px;cursor:pointer;
    border-left:3px solid var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:baseline;gap:4px;
  }
  .gchip .gt{overflow:hidden;text-overflow:ellipsis}
  .gchip .gr{opacity:.7;font-size:9px;flex:0 0 auto}
  .gchip.idea{background:transparent;border:1px dashed var(--c);border-left-width:3px;color:var(--c)}
  .gchip.draft{background:color-mix(in srgb,var(--c) 13%,#fff);border:1px dashed var(--c);border-left-width:3px;color:color-mix(in srgb,var(--c) 78%,#000)}
  .gchip.confirmed{background:color-mix(in srgb,var(--c) 20%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 82%,#000)}
  .gchip.approved{background:var(--c);border:1px solid var(--c);border-left:3px solid color-mix(in srgb,var(--c) 60%,#000);color:#fff}
  .cell{
    min-width:0;overflow:hidden;
    min-height:var(--cell-min);border-left:1px solid var(--hair);border-top:1px solid var(--hair);
    padding:3px 4px 5px;position:relative;cursor:pointer;transition:background .1s;
  }
  .cell:hover{background:#fff}
  .cell.we{background:rgba(69,69,158,.022)}
  .cell.other{background:repeating-linear-gradient(135deg,transparent,transparent 6px,rgba(0,0,0,.012) 6px,rgba(0,0,0,.012) 7px)}
  .cell.other .dnum{color:var(--faint)}
  .cell.today .dnum{background:var(--today);color:#fff}
  .cell.today{box-shadow:inset 0 0 0 2px var(--today)}
  .dnum{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:19px;height:19px;padding:0 5px;border-radius:11px;
    font-size:11px;font-weight:600;color:var(--muted);margin:1px 0 3px;
  }
  .cell .add-hint{
    position:absolute;top:4px;right:5px;font-size:14px;line-height:1;color:var(--accent);
    opacity:0;transition:.1s;font-weight:500;
  }
  .cell:hover .add-hint{opacity:.55}

  /* chips */
  .chips{display:flex;flex-direction:column;gap:2px;min-width:0}
  .chip{
    font-size:11px;line-height:1.25;border-radius:4px;padding:2px 5px 2px 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
    border-left:3px solid var(--c,var(--p-oth));position:relative;
  }
  .chip .t{font-weight:500}
  .chip .time{font-size:9.5px;color:inherit;opacity:.7;font-weight:400;margin-right:3px}
  /* planning status treatments */
  .chip.idea{background:transparent;border:1px dashed var(--c);border-left-width:3px;color:var(--c)}
  .chip.draft{background:color-mix(in srgb,var(--c) 13%,#fff);border:1px dashed var(--c);border-left-width:3px;color:color-mix(in srgb,var(--c) 78%,#000)}
  .chip.confirmed{background:color-mix(in srgb,var(--c) 20%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 82%,#000)}
  .chip.approved{background:var(--c);border:1px solid var(--c);border-left:3px solid color-mix(in srgb,var(--c) 60%,#000);color:#fff}
  .chip.approved .lock{margin-left:3px;opacity:.85}
  /* reference chips: quiet ground */
  .chip.ref{
    background:transparent;border:0;border-left:0;padding-left:12px;color:var(--muted);
    font-size:10.5px;font-weight:400;
  }
  .chip.ref::before{content:"";position:absolute;left:3px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--c)}
  .chip.ref .t{font-weight:400}
  .chip.more{cursor:pointer;color:var(--faint);font-size:10px;padding:1px 5px;border:0;background:transparent}
  .chip.more:hover{color:var(--accent)}

  /* ---- modal ---- */
  .scrim{position:fixed;inset:0;background:rgba(28,27,34,.34);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
  .scrim.open{display:flex}
  .modal{
    background:#fff;border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:440px;
    border:1px solid var(--hair-strong);overflow:hidden;
    display:flex;flex-direction:column;max-height:calc(100dvh - 96px);
  }
  .modal .mhead{padding:15px 18px 12px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .modal .mhead .stripe{width:5px;height:34px;border-radius:3px;background:var(--c,var(--accent))}
  .modal .mhead h2{font-family:Fraunces,serif;font-weight:600;font-size:16px;margin:0;flex:1}
  .modal .mhead .badge{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding:3px 7px;border-radius:20px}
  .badge.b-idea{background:#F0F0F3;color:#75747F}
  .badge.b-draft{background:#FBF3E4;color:#9A7B2E}
  .badge.b-confirmed{background:#E7F1EA;color:#3C7A55}
  .badge.b-approved{background:var(--accent);color:#fff}
  .badge.b-ref{background:#F0EFEC;color:#8A8896}
  .mbody{padding:14px 18px 4px;display:grid;grid-template-columns:1fr 1fr;gap:11px 12px;overflow-y:auto;min-height:0}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld.full{grid-column:1/3}
  .fld label{font-size:10.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.6px}
  .fld input,.fld select,.fld textarea{
    font:inherit;font-size:13px;color:var(--ink);background:#fff;
    border:1px solid var(--hair-strong);border-radius:6px;padding:7px 8px;width:100%;
  }
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
  .fld textarea{resize:vertical;min-height:52px}
  .fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:#F7F6F3;color:var(--muted);cursor:not-allowed}
  .leadchips{display:flex;flex-wrap:wrap;gap:4px}
  .leadchip{font-size:11px;padding:3px 7px;border-radius:20px;border:1px solid var(--hair-strong);cursor:pointer;background:#fff;color:var(--muted)}
  .leadchip[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-dk);font-weight:500}
  .leadchip:disabled{cursor:not-allowed;opacity:.6}
  .allday{display:flex;align-items:center;gap:7px;align-self:end;padding-bottom:8px}
  .allday input{width:auto}
  .meta{grid-column:1/3;font-size:11px;color:var(--faint);border-top:1px dashed var(--hair);padding-top:9px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .mfoot{padding:12px 18px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--hair);margin-top:8px;flex-shrink:0}
  .mfoot .push{flex:1}
  .danger{color:#B23B3B;border-color:#E7C9C9}
  .danger:hover{background:#FBEEEE;border-color:#B23B3B;color:#B23B3B}
  .locknote{font-size:11px;color:var(--muted);background:#F7F6F3;border:1px solid var(--hair);border-radius:6px;padding:8px 10px;grid-column:1/3;display:flex;align-items:center;gap:8px}
  .locknote a{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
  .locknote a:hover{text-decoration:underline}

  /* legend footer */
  .legend{max-width:1180px;margin:14px auto 0;padding:0 18px;color:var(--faint);font-size:11px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .infogrid{display:flex;flex-wrap:wrap;gap:6px 14px}
  .k{display:inline-flex;align-items:center;gap:5px}
  .k .sw{width:22px;height:12px;border-radius:3px;flex:0 0 auto}
  .sw.i{border:1px dashed var(--faint)}
  .sw.d{border:1px dashed var(--faint);background:#EDEDED}
  .sw.c{border:1px solid #bbb;background:#DDD}
  .sw.a{background:var(--faint)}

  .banner{max-width:1180px;margin:10px auto 0;padding:9px 14px;background:var(--accent-tint);border:1px solid #D5D5EC;border-radius:8px;color:var(--accent-dk);font-size:11.5px;line-height:1.5}
  .banner b{color:var(--accent-dk)}

  /* ---- quarter (zoomed-out) view ---- */
  #quarter{display:none;padding-top:6px}
  #quarter.on{display:block}
  .qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .qcol{border:1px solid var(--hair-strong);border-radius:10px;overflow:hidden;background:#fff;min-width:0}
  .qhead{font-family:Fraunces,serif;font-weight:600;font-size:15px;padding:9px 12px 8px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:baseline}
  .qhead .qy{font-family:Inter,sans-serif;font-size:10px;letter-spacing:1px;color:var(--faint);font-weight:600}
  .qtbd{padding:6px 10px;border-top:1px dashed var(--hair);background:rgba(69,69,158,.03);display:flex;flex-direction:column;gap:3px}
  .qtbd .lbl{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
  .qweek{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--hair);min-height:38px}
  .qwk{font-size:10px;color:var(--faint);padding:5px 3px 0 7px;line-height:1.15;border-right:1px solid var(--hair)}
  .qzone{padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
  .qzone.wknd{background:rgba(69,69,158,.035);border-left:1px solid var(--hair)}
  .qzone .zlbl{font-size:11px;color:#D3D0C8;text-align:center;padding-top:2px}
  .qchip{font-size:10px;line-height:1.25;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--c)}
  .qchip.idea{background:transparent;border:1px dashed var(--c);border-left-width:3px;color:var(--c)}
  .qchip.draft{background:color-mix(in srgb,var(--c) 13%,#fff);border:1px dashed var(--c);border-left-width:3px;color:color-mix(in srgb,var(--c) 80%,#000)}
  .qchip.confirmed{background:color-mix(in srgb,var(--c) 20%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 82%,#000)}
  .qchip.approved{background:var(--c);color:#fff;border:1px solid var(--c);border-left:3px solid color-mix(in srgb,var(--c) 60%,#000)}
  .qchip.ref{background:transparent;border:0;border-left:0;padding-left:11px;color:var(--muted);font-size:9.5px;position:relative}
  .qchip.ref::before{content:"";position:absolute;left:2px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--c)}

  /* ---- when-control (modal) ---- */
  .whenseg{display:inline-flex;border:1px solid var(--hair-strong);border-radius:6px;overflow:hidden;background:#fff;width:max-content}
  .whenseg button{font:inherit;font-size:11px;border:0;background:transparent;padding:5px 10px;cursor:pointer;color:var(--muted)}
  .whenseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .whenseg button:disabled{cursor:not-allowed;opacity:.5}

  @media (max-width:820px){ .qgrid{grid-template-columns:1fr} }

  @media (max-width:720px){
    :root{--cell-min:70px}
    .mbody{grid-template-columns:1fr}
    .fld.full,.meta,.locknote{grid-column:1}
  }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>

<div class="bar">
  <div class="bar-inner row1">
    <div class="brand">
      <h1>Programming — Planning Calendar</h1>
      <span class="sub">East Side Tribe · draft events, no eventbrite/gCal required</span>
    </div>
    <span class="grow-sp"></span>
    <button class="info-btn" id="infoBtn" title="Legend & key" aria-label="Legend and key">i</button>
  </div>
  <div class="bar-inner row2">
    <div class="seg" id="viewSeg">
      <button data-view="overview" aria-pressed="true">Overview</button>
      <button data-view="year" aria-pressed="false">Calendar</button>
    </div>
    <div class="yearnav">
      <button class="btn icon" id="prevYr" aria-label="Previous program year">‹</button>
      <span class="yr" id="yrLabel">2026–2027</span>
      <button class="btn icon" id="nextYr" aria-label="Next program year">›</button>
      <button class="btn ghost" id="todayBtn">Today</button>
      <button class="btn ghost" id="refreshBtn" title="Refresh from Coda" aria-label="Refresh">↻</button>
    </div>
    <span class="grow-sp"></span>
    <span id="authSlot" class="authslot" style="display:flex;align-items:center;gap:8px"></span>
    <button class="btn primary" id="addBtn">+ New event</button>
  </div>
</div>

<div class="layers" id="layers">
  <span class="grp-label">Your plans</span>
  <label class="lyr" data-on="true" data-layer="planning" title="Your planning events (always shown)">
    <span class="dot" style="background:linear-gradient(135deg,var(--p-kab),var(--p-tot))"></span>
    <span class="name">Planning events</span>
  </label>
  <span class="spacer"></span>
  <span class="grp-label">Reference</span>
  <!-- reference toggles injected -->
</div>

<div class="wrap">

  <div id="yearView">
    <div class="weekhead" id="weekhead"></div>
    <div id="months"></div>
  </div>
  <div id="quarter"></div>
</div>

<!-- ---- modal ---- -->
<div class="scrim" id="scrim">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead">
      <div class="stripe" id="mStripe"></div>
      <h2 id="mTitle">Event</h2>
      <span class="badge" id="mBadge"></span>
    </div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

<script>
/* =========================================================================
   DATA LAYER  —  the only part that changes when we go live on Coda.
   Everything below `DataSource` treats events in one normalized shape:
     { id, source, program, title, leads:[], date:'YYYY-MM-DD',
       start, end, allDay, location, status, description,
       createdBy, editedBy, readOnly, eventbriteUrl, gcalId }
   The mock stores rows in *Coda list-rows shape* and transforms them, so the
   live swap is: replace MockSource with CodaSource (fetch -> proxy) and reuse
   codaRowToEvent / eventToCodaCells verbatim.
   ========================================================================= */

let PROGRAMS = [
  {id:'kab', name:'Kabbalat Shabbat',      color:'var(--p-kab)'},
  {id:'din', name:'Shabbat dinner',        color:'var(--p-din)'},

/* EST Planning Events SRC row (Coda simpleWithArrays + useColumnNames) -> event.
   Relation cells (Program(s)/Leads/Venue/…by) arrive as arrays of display strings;
   Date/Window come back as ISO datetimes (slice to YYYY-MM-DD); Start/End are a
   native time column, serialized as a 1899-placeholder ISO (see _toHM); Month
   scheduling lives in Date=1st -> targetMonth. Read-only until Plan 2b. */
const _nameOf = x => typeof x === 'string' ? x : (x && x.name) || '';
const _asList = v => (v == null || v === '') ? [] : (Array.isArray(v) ? v : [v]).map(_nameOf).filter(Boolean);
const _toHM = s => { const m = String(s || '').match(/(?:T|^)(\d{2}:\d{2})/); return m ? m[1] : ''; };
function planningRowToEvent(r){
  const v = r.values || {};
  const progs = _asList(v['Program(s)']);               // all programs (names)
  const venue = _asList(v['Venue'])[0] || '';
  const sched = String(v['Scheduling'] || 'Exact').toLowerCase();
  const rawDate = String(v['Date'] || '').slice(0,10);
  return {
    id: r.id, source:'planning',
    program: progIdByName[progs[0]] || 'oth',           // primary program drives the color
    programs: progs.map(p => progIdByName[p] || 'oth'),  // full list (crossover UI: Plan 2b)
    title: v['Title'] || '',
    leads: _asList(v['Leads']),
    date: sched === 'month' ? '' : rawDate,              // Month renders as an undated month idea
    start: _toHM(v['Start']), end: _toHM(v['End']), allDay: !!v['All day'],
    location: venue || (v['Venue (other)'] || ''),
    status: String(v['Status'] || 'idea').toLowerCase(),
    description: v['Event Description'] || '',
    planningNotes: v['Planning Notes'] || '',
    createdBy: _asList(v['Created by'])[0] || '', editedBy: _asList(v['Edited by'])[0] || '',
    eventbriteUrl:'', gcalId:'', readOnly:true,          // writes come in Plan 2b
    scheduling: sched,
    rangeStart: String(v['Window start'] || '').slice(0,10),
    rangeEnd: String(v['Window end'] || '').slice(0,10),
    targetMonth: sched === 'month' ? rawDate.slice(0,7) : ''
  };
}

function monthKey(y,m){ return `${y}-${pad(m+1)}`; }

function roughMonthKey(e){
  if(e.scheduling==='month') return e.targetMonth||'';
  if(e.scheduling==='range' && e.rangeStart && e.rangeEnd){
    const a=new Date(e.rangeStart), b=new Date(e.rangeEnd), mid=new Date((a.getTime()+b.getTime())/2);
    return monthKey(mid.getFullYear(), mid.getMonth());
  }
  return e.rangeStart ? e.rangeStart.slice(0,7) : '';
}
function roughByMonth(){
  const m={};
  if(!state.layers.planning) return m;
  for(const e of state.events){ if(!isRough(e)) continue; const k=roughMonthKey(e); if(!k) continue; (m[k]=m[k]||[]).push(e); }
  return m;
}

function renderMonths(){
  const wrap=document.getElementById('months');
  const byDate=eventsByDate();
  const roughMap=roughByMonth();
  const shabOn=state.layers.shab;
  let html='';
  for(const {y,m} of monthsOfYear()){
    const mk=monthKey(y,m);
    const startWd=new Date(y,m,1).getDay();
    const daysIn=new Date(y,m+1,0).getDate();
    const prevDays=new Date(y,m,0).getDate();
    const rows=Math.ceil((startWd+daysIn)/7);
    // anchor each rough idea to the week row its rough timeframe starts in
    const byWeek={};
    for(const e of (roughMap[mk]||[])){ const r=Math.min(anchorRow(e,mk,startWd), rows-1); (byWeek[r]=byWeek[r]||[]).push(e); }

    let body='';
    for(let w=0; w<rows; w++){
      const ideas=(byWeek[w]||[]);
      const ghint = w===0 ? `<span class="ghint">date TBD</span>` : '';
      body += `<div class="gcell" data-newidea="${mk}">${ghint}<span class="gadd">＋</span>${ideas.map(e=>gchipHTML(e,mk)).join('')}</div>`;
      for(let k=0;k<7;k++){
        const dayNum=w*7+k-startWd+1;
        let cy=y,cm=m,dn=dayNum,other=false;
        if(dayNum<1){ other=true; cm=m-1; cy=m===0?y-1:y; dn=prevDays+dayNum; if(cm<0){cm=11;} }
        else if(dayNum>daysIn){ other=true; cm=m+1; cy=m===11?y+1:y; dn=dayNum-daysIn; if(cm>11){cm=0;} }
        const ds=ymd(cy,cm,dn);
        const isToday=ds===todayStr;
        const evs=(byDate[ds]||[]).slice().sort(sortEv);
        const shabMark=(shabOn && k===5 && !other) ? `<div class="chip ref" style="--c:var(--r-shab)" data-noop="1"><span class="t">Shabbat</span></div>` : '';
        body += `<div class="cell ${other?'other':''} ${k===0||k===6?'we':''} ${isToday?'today':''}" data-date="${ds}" ${other?'data-other="1"':''}>
          <span class="add-hint">+</span>
          <span class="dnum">${dn}</span>
          <div class="chips">${shabMark}${evs.map(chipHTML).join('')}</div>
        </div>`;
      }
    }
    html+=`<div class="month">
      <div class="myear-head">${MONTHS[m]}<span class="yy">${y}</span></div>
      <div class="mgrid">${body}</div>
    </div>`;
  }
  wrap.innerHTML=html;
}

/* =========================================================================
   OVERVIEW (ZOOMED-OUT) VIEW — whole year, months as cards (3 per row),
   weeks as rows bucketed weeknight (Mon–Thu) | weekend (Fri–Sun);
   undated ideas sit in a card footer
   ========================================================================= */
function qchipHTML(e){
  if(e.source==='ref') return `<div class="qchip ref" style="--c:${REF[e.refLayer].color}" data-id="${e.id}" title="${esc(e.title)}">${esc(e.title)}</div>`;
  const c=PROG[e.program].color;
  return `<div class="qchip ${e.status}" style="--c:${c}" data-id="${e.id}" title="${esc(e.title)} — ${cap(e.status)}">${esc(e.title)}${xMark(e)}</div>`;
}
function weekAddDate(y,m,dayNums,zone){
  const want = zone==='wknd' ? d=>isWeekend(new Date(y,m,d).getDay()) : d=>!isWeekend(new Date(y,m,d).getDay());
  const hit=dayNums.find(want); return ymd(y,m,hit||dayNums[0]);
}
function renderOverview(){
  const cont=document.getElementById('quarter');
  const byDate=eventsByDate();
  const roughMap=roughByMonth();
  const cmp=(a,b)=>(a.date||'').localeCompare(b.date||'') || (a.source===b.source?0:(a.source==='planning'?-1:1)) || ((a.start||'').localeCompare(b.start||''));
  let cols='';
  for(const {y,m} of monthsOfYear()){
    const mk=monthKey(y,m);
    const first=new Date(y,m,1), startWd=first.getDay(), daysIn=new Date(y,m+1,0).getDate();
    let weeks='';
    const rows=Math.ceil((startWd+daysIn)/7);
    for(let w=0; w<rows; w++){
      const dayNums=[];
      for(let k=0;k<7;k++){ const dn=w*7+k-startWd+1; if(dn>=1&&dn<=daysIn) dayNums.push(dn); }
      if(!dayNums.length) continue;
      const wkn=[], wknd=[];
      for(const dn of dayNums){
        const ds=ymd(y,m,dn), dow=new Date(y,m,dn).getDay();
        for(const e of (byDate[ds]||[])){ (isWeekend(dow)?wknd:wkn).push(e); }
      }
      wkn.sort(cmp); wknd.sort(cmp);
      const lbl = dayNums[0]===dayNums[dayNums.length-1] ? `${dayNums[0]}` : `${dayNums[0]}–${dayNums[dayNums.length-1]}`;
      weeks += `<div class="qweek">
        <div class="qwk">${lbl}</div>
        <div class="qzone wkn" data-add="${weekAddDate(y,m,dayNums,'wkn')}">${wkn.map(qchipHTML).join('')||'<span class="zlbl">·</span>'}</div>
        <div class="qzone wknd" data-add="${weekAddDate(y,m,dayNums,'wknd')}">${wknd.map(qchipHTML).join('')||'<span class="zlbl">·</span>'}</div>
      </div>`;
    }
    const rough=(roughMap[mk]||[]);
    const ftr = rough.length ? `<div class="qtbd"><span class="lbl">date TBD</span>${rough.map(e=>{
      const r = e.scheduling==='range' ? ` <span style="opacity:.6;font-size:9px">(${e.rangeStart.slice(8,10)}–${e.rangeEnd.slice(8,10)})</span>` : '';
      return `<div class="qchip ${e.status}" style="--c:${(PROG[e.program]||{}).color}" data-id="${e.id}" title="${esc(e.title)}">${esc(e.title)}${xMark(e)}${r}</div>`;
    }).join('')}</div>` : '';
    cols += `<div class="qcol" data-mk="${mk}"><div class="qhead"><span>${MONTHS[m]}</span><span class="qy">${y}</span></div><div>${weeks}</div>${ftr}</div>`;
  }
  cont.innerHTML=`<div class="qgrid">${cols}</div>
    <div class="legend" style="margin-top:14px"><span class="k" style="color:var(--faint)">Each week splits into <b style="color:var(--muted)">weeknight</b> (Mon–Thu) and <b style="color:var(--muted)">weekend</b> (Fri–Sun). Undated ideas sit in each month's footer. Click a lane to add.</span></div>`;
}

function sortEv(a,b){
  if(a.source!==b.source) return a.source==='planning'?-1:1;      // plans above refs
  const at=a.allDay?'':(a.start||''), bt=b.allDay?'':(b.start||'');
  return at.localeCompare(bt);
}

function renderLayers(){
  const box=document.getElementById('layers');

    el.innerHTML=`<span class="swatch-ref" style="background:${r.color}"></span><span class="name">${r.name}</span>`;

function openEditor(ev){

  }

  body.innerHTML = `
    <div class="fld full"><label>Title</label><input id="f_title" value="${esc(ev.title)}" ${dis} placeholder="e.g. Kabbalat Shabbat"></div>
    <div class="fld full"><label>Program(s)</label><div class="leadchips" id="f_progs">${PROGRAMS.filter(p=>p.id!=='oth' && (p.active!==false || (ev.programs&&ev.programs.includes(p.id)))).map(p=>`<button type="button" class="leadchip" data-p="${p.id}" aria-pressed="${(ev.programs&&ev.programs.length?ev.programs:[ev.program]).includes(p.id)}" ${dis}>${esc(p.name)}</button>`).join('')}</div></div>
    <div class="fld"><label>Status</label><select id="f_status" ${dis}>${STATUSES.filter(s=>s!=='approved').map(s=>`<option value="${s}" ${s===ev.status?'selected':''}>${cap(s)}</option>`).join('')}${ev.status==='approved'?'<option value="approved" selected>Approved</option>':''}</select></div>
    <div class="fld full"><label>When</label>
      <div class="whenseg" id="f_when">
        <button type="button" data-when="exact" aria-pressed="${sched==='exact'}" ${dis}>Exact date</button>
        <button type="button" data-when="range" aria-pressed="${sched==='range'}" ${dis}>Date range</button>
        <button type="button" data-when="month" aria-pressed="${sched==='month'}" ${dis}>Whole month</button>
      </div>
    </div>
    <div class="fld full" id="whenFields"></div>
    <div class="fld"><label>Start time</label><input id="f_start" type="time" value="${ev.start||''}" ${dis}></div>
    <div class="fld"><label>End time</label><input id="f_end" type="time" value="${ev.end||''}" ${dis}></div>
    <div class="allday" style="grid-column:1/3"><input id="f_allday" type="checkbox" ${ev.allDay?'checked':''} ${dis}><label for="f_allday" style="text-transform:none;color:var(--muted);font-weight:500">All day (no set time)</label></div>
    <div class="fld full"><label>Location</label><input id="f_loc" value="${esc(ev.location||'')}" ${dis} placeholder="Venue or 'TBD'"></div>
    <div class="fld full"><label>Leads</label><div class="leadchips" id="f_leads">${PEOPLE.map(p=>`<button type="button" class="leadchip" data-p="${p}" aria-pressed="${ev.leads.includes(p)}" disabled>${p}</button>`).join('')}</div></div>
    <div class="fld full"><label>Description</label><textarea id="f_desc" ${dis} placeholder="What's the plan?">${esc(ev.description||'')}</textarea></div>
    ${(!canEdit)?`<div class="locknote">Sign in as a program lead to edit.</div>`:``}
    ${(canEdit&&!locked)?`<div class="locknote">Leads &amp; venue: set in Coda for now — pickers arrive next.</div>`:``}
    ${locked?`<div class="locknote">🔒 Approved &amp; locked. Detailed edits (ticketing, banner, promotion) happen in Coda. <a href="#" data-act="coda">Open in Mission Control ↗</a></div>`:''}
    ${ev.id?`<div class="meta"><span>Created by ${esc(ev.createdBy||'—')}</span><span>Last edited by ${esc(ev.editedBy||'—')}</span></div>`:''}`;

  // footer actions
  const foot=document.getElementById('mFoot');

function readForm(){
  const g=id=>document.getElementById(id);
  const leads=[...document.querySelectorAll('#f_leads .leadchip')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.dataset.p);
  const programs=[...document.querySelectorAll('#f_progs .leadchip')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.dataset.p);
  const w=collectWhen();
  const o={
    program:programs[0]||'oth', programs, status:g('f_status').value, title:g('f_title').value.trim()||'Untitled',
    allDay:g('f_allday').checked, start:g('f_start').value, end:g('f_end').value,
    location:g('f_loc').value.trim(), description:g('f_desc').value.trim(), leads,
    scheduling:whenType, date:'', rangeStart:'', rangeEnd:'', targetMonth:''
  };
  if(whenType==='exact') o.date=w.date||'';
  else if(whenType==='range'){ o.rangeStart=w.rangeStart||''; o.rangeEnd=w.rangeEnd||w.rangeStart||''; }
  else if(whenType==='month') o.targetMonth=w.targetMonth||'';
  return o;
}

async function saveEditor(approve){
  const f=readForm();
  const base = editing.id ? editing : {source:'planning', eventbriteUrl:'', gcalId:''};
  const e = Object.assign({}, base, f);
  if(approve) e.status='approved';
  try {
    if(editing.id){ await DB.update(e); } else { await DB.create(e); }
    close(); await refresh();
  } catch(err){ alert(String(err && err.message || err)); }
}
async function deleteEditor(){
  try {
    if(editing && editing.id){ await DB.remove(editing.id); }
    close(); await refresh();
  } catch(err){ alert(String(err && err.message || err)); }
}

  } else {
    el.innerHTML = `<span id="gbtn"></span>`;
    if(GOOGLE_CLIENT_ID && window.google && google.accounts && google.accounts.id)
      google.accounts.id.renderButton(el.querySelector('#gbtn'), { type:'standard', size:'medium', text:'signin_with', shape:'pill' });
  }
}
async function fetchMe(){
  if(!PROXY_BASE || !state.idToken){ state.identity=null; renderAuth(); return; }
  try{
    const r = await fetch(`${PROXY_BASE}/me`, { headers:{ 'Authorization':`Bearer ${state.idToken}` } });
    state.identity = r.ok ? await r.json() : null;
  }catch(_){ state.identity=null; }
  renderAuth(); applyView();
}
async function onCredential(resp){ state.idToken = (resp && resp.credential) || null; await fetchMe(); }
function signOut(){ state.idToken=null; state.identity=null; try{ google.accounts.id.disableAutoSelect(); }catch(_){} renderAuth(); applyView(); }
function initAuth(){
  if(!GOOGLE_CLIENT_ID){ renderAuth(); return; }                         // not configured yet
  if(!(window.google && google.accounts && google.accounts.id)) return setTimeout(initAuth, 300); // wait for GIS
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true });
  renderAuth();
  if(!state.idToken) google.accounts.id.prompt();     // silent re-auth for returning users
}

let _refreshing = false;
async function refresh(){
  if(_refreshing) return;                    // don't stack overlapping polls/clicks
  _refreshing = true;
  try { await loadEvents(); applyView(); layoutSticky(); } finally { _refreshing = false; }
}
async function init(){
  buildWeekHead(); renderLayers(); updateNavLabel(); initAuth();
  await loadPrograms();
  await loadEvents(); applyView(); layoutSticky();
  const rb = document.getElementById('refreshBtn'); if(rb) rb.addEventListener('click', refresh);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); }); // refetch on tab focus
  setInterval(() => { if(!document.hidden) refresh(); }, 60000);                            // light 60s poll while visible
  setTimeout(()=>{
    const t=new Date();
    if(state.view==='overview'){ const el=document.querySelector(`.qcol[data-mk="${monthKey(t.getFullYear(),t.getMonth())}"]`); if(el) el.scrollIntoView({block:'center'}); }
    else { const el=document.querySelector('.cell.today'); if(el) el.scrollIntoView({block:'center'}); }
  },60);
}

/* utils */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):s;}
function fmtDate(ds){const [y,m,d]=ds.split('-').map(Number);return `${WD[new Date(y,m-1,d).getDay()]}, ${MONTHS[m-1]} ${d}, ${y}`;}

init();
</script>
